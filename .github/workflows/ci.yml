name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[app,dev]"
      - name: Build deterministic demo artifact
        run: python scripts/train_demo_model.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=src --cov-report=term-missing
      - name: Runtime acceptance
        run: python scripts/day3_acceptance.py
      - name: Build container
        run: docker build -t nfhs5-high-parity-ml:test .
