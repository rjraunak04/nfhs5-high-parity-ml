[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfhs5-high-parity-ml"
version = "0.2.0"
description = "Explainable high-parity classification with auditable agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ankur Kumar Jaiswal"}]
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
app = [
  "fastapi>=0.115,<1",
  "requests>=2.31,<3",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]
train = [
  "optuna>=4,<5",
  "pyreadstat>=1.2,<2",
  "statsmodels>=0.14,<1",
]
explain = [
  "matplotlib>=3.8,<4",
  "shap>=0.46,<1",
]
llm = [
  "openai>=2,<3",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
